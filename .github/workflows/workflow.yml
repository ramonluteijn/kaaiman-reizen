name: workflow.yml
on:
    pull_request:
        branches: [ main ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up .NET 10
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: 10.0.x
            - name: Restore
              run: dotnet restore Kaaiman-reizen.sln
            - name: Lint
              run: dotnet format Kaaiman-reizen.sln --verify-no-changes
            - name: Build
              run: dotnet build Kaaiman-reizen.sln --no-restore --configuration Release
            - name: Run tests
              run: dotnet test Kaaiman-reizen.Tests/Kaaiman-reizen.Tests.csproj --no-build --configuration Release
